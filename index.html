<script>
  // GitHub Pages SPA redirect handler
  (function(l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function(s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location));
</script>

    <script>
      /* ============================================================
     Vexec — Boot: apply theme / accent / font BEFORE first paint
     Reads from cookies set by Profile → Settings
     ============================================================ */
      (function () {
        var HTML = document.documentElement;

        function getCookie(name) {
          var m = document.cookie.match(
            new RegExp("(^| )" + name + "=([^;]+)"),
          );
          return m ? decodeURIComponent(m[2]) : null;
        }

        /* ---- Theme (auto → system) ---- */
        var pref = getCookie("theme") || "auto";
        var resolved =
          pref === "auto"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : pref;
        HTML.setAttribute("data-theme", resolved);
        HTML.setAttribute("data-theme-pref", pref);
        HTML.style.colorScheme = resolved;

        /* ---- Accent color ---- */
        var accent = getCookie("accent");
        if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
          HTML.style.setProperty("--accent", accent);
          HTML.setAttribute("data-accent", accent);
        }

        /* ---- Font size ---- */
        var fs = getCookie("fontSize");
        if (fs) {
          var n = parseInt(fs, 10);
          if (isFinite(n) && n >= 60 && n <= 150) HTML.style.fontSize = n + "%";
        }

        /* ---- Font family ---- */
        var ff = getCookie("fontFamily");
        var stacks = {
          Inter: "'Inter', system-ui, -apple-system, sans-serif",
          "Space Grotesk":
            "'Space Grotesk', system-ui, -apple-system, sans-serif",
          Georgia: "Georgia, 'Times New Roman', serif",
          "ui-monospace": "ui-monospace, 'SF Mono', Menlo, Consolas, monospace",
        };
        if (ff && stacks[ff]) HTML.style.setProperty("--font-body", stacks[ff]);

        /* ---- Theme-based logo (fast paint, from cache) ---- */
        try {
          var _accent = getCookie("accent") || "#3b82f6";
          var _map = JSON.parse(localStorage.getItem("vexec:logos:v1") || "{}");
          window.__vexecLogo =
            _map[_accent] || _map["default"] || "./assets/pictures/vexec.png";
        } catch (e) {
          window.__vexecLogo = "./assets/pictures/vexec.png";
        }
      })();
    </script>
